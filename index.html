<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jassabend">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Jassabend</title>
<style>
  :root {
    --bg: #000;
    --panel: #141414;
    --panel2: #1e1e1e;
    --line: #2c2c2c;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --rot: #e0262b;
    --gruen: #3fb950;
    --gold: #e3b341;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    min-height: 100vh;
    -webkit-user-select: none; user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; }
  button.primaer { background: var(--rot); border-color: var(--rot); font-weight: 600; }
  button.gross { padding: 16px 22px; font-size: 20px; }
  button.klein { padding: 6px 12px; font-size: 15px; }
  button.link { background: none; border: none; color: var(--muted); padding: 6px; }
  input, select {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0;
  }
  input[type=number] { width: 110px; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  h2 { font-size: 22px; margin-bottom: 12px; }
  h3 { font-size: 17px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }

  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 20px;
    border-bottom: 2px solid var(--rot);
  }
  header h1 { font-size: 24px; letter-spacing: .5px; }
  header h1 { display: flex; align-items: center; gap: 8px; }
  .farben { display: flex; justify-content: center; gap: 22px; }
  nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: none; border-color: transparent; color: var(--muted); }
  nav button.aktiv { color: var(--text); border-color: var(--line); background: var(--panel2); }

  main { padding: 20px; max-width: 1300px; margin: 0 auto; padding-bottom: 60px; }
  .karte { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .stapel > * + * { margin-top: 16px; }
  .zeile { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .zeile.weit { justify-content: space-between; }
  .gitter2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .gitter-abend { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .gitter-abend, .gitter2 { grid-template-columns: 1fr; } }
  .gedaempft { color: var(--muted); }
  .klein-text { font-size: 14px; }
  .zahl { font-variant-numeric: tabular-nums; }
  .rechts { text-align: right; }

  /* Team-Felder */
  .team { position: relative; }
  .team .namen { font-size: 22px; font-weight: 600; }
  .team .namen .und { color: var(--muted); font-weight: 400; }
  .team .summe { font-size: 44px; font-weight: 700; line-height: 1; }
  .team .tafel { min-height: 70px; margin: 14px 0; display: flex; align-items: center; }
  .team .knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .team .knoepfe button { padding: 18px 8px; font-size: 19px; font-weight: 600; }
  .team .knoepfe button small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .team.sieger { border-color: var(--gold); }
  .marke { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .marke.gold { color: #000; background: var(--gold); border-color: var(--gold); font-weight: 600; }
  .marke.rot { color: #fff; background: var(--rot); border-color: var(--rot); }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 14px; }
  tr:last-child td { border-bottom: none; }

  .los-anzeige { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; text-align: center; margin: 10px 0 4px; }
  .los-anzeige .paar { font-size: 24px; font-weight: 600; padding: 16px; border-radius: 12px; background: var(--panel2); transition: color .15s; }
  .los-anzeige .vs { color: var(--rot); font-weight: 700; }
  .mischen .paar { color: var(--muted); }

  .titel-rang { font-size: 30px; width: 44px; text-align: center; }
  .kasse-stand { font-size: 56px; font-weight: 700; line-height: 1.1; }
  .positiv { color: var(--gruen); }
  .negativ { color: var(--rot); }

  details.abend { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  details.abend + details.abend { margin-top: 10px; }
  details.abend summary { list-style: none; padding: 16px 18px; cursor: pointer; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  details.abend summary::-webkit-details-marker { display: none; }
  details.abend .inhalt { padding: 0 18px 18px; }
  .leer { text-align: center; padding: 50px 20px; color: var(--muted); }
  .hinweis { font-size: 14px; color: var(--muted); }
  .orte { display: flex; gap: 8px; flex-wrap: wrap; }
  .orte button { border-radius: 99px; }
  .orte button.gewaehlt { border-color: var(--rot); color: var(--text); }
  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: #2a1d05; border: 1px solid var(--gold); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
  h2.jahr { margin: 26px 0 10px; }
  .trumpf { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .trumpf button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font-size: 14px; }
  .trumpf button small { color: var(--muted); }
  button.gewaehlt { border-color: var(--rot); background: #3a1214; }
  .weis { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .weis button { padding: 8px 10px; min-width: 52px; }
  .eingabe-team { background: var(--panel2); border-radius: 12px; padding: 12px; }
  .eingabe-team .namen { font-weight: 600; margin-bottom: 8px; }
  .eingabe-team input[type=number] { width: 100%; font-size: 22px; text-align: center; }
  .vorschau { font-size: 18px; text-align: center; }
  .balken { position: relative; height: 10px; background: var(--panel2); border-radius: 99px; margin: 8px 0 2px; overflow: visible; }
  .balken > div { height: 100%; background: var(--rot); border-radius: 99px; }
  .balken .berg-marke { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--muted); }
  .ansager { font-size: 17px; }
  tr.klickbar { cursor: pointer; }
  tr.bearbeitet td { background: #3a1214; }
  .umschalter { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .umschalter button { border: none; border-radius: 0; background: none; color: var(--muted); }
  .umschalter button.aktiv { background: var(--rot); color: #fff; }
  .tafel-ansicht { display: flex; flex-direction: column; align-items: center; }
  .tafel-ansicht svg { width: 100%; max-height: calc((100vh - 190px) / 2); display: block; }
  .tafel-trenner { width: 100%; height: 4px; background: var(--rot); border-radius: 2px; margin: 4px 0; }
  .tafel-leiste { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); padding: 12px 20px; border-radius: 12px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.sichtbar { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1><span id="logo"></span> Jassabend</h1>
  <nav id="nav">
    <button data-seite="abend">Abend</button>
    <button data-seite="chronik">Chronik</button>
    <button data-seite="rangliste">Rangliste</button>
    <button data-seite="kasse">Jasskasse</button>
    <button data-seite="einstellungen">⚙︎</button>
  </nav>
</header>
<main id="inhalt"></main>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ---------- Daten ----------

const SPEICHER_SCHLUESSEL = 'jassabend-v1';
const TYPEN = {
  berg:  { name: 'Berg',  einmalig: true },
  match: { name: 'Match', einmalig: false },
  ziel:  { name: 'Ziel',  einmalig: true },
};

function standardDaten() {
  return {
    version: 1,
    spieler: ['Spieler 1', 'Spieler 2', 'Spieler 3', 'Spieler 4'],
    regeln: {
      berg: 1, match: 1, ziel: 2, franken: 1, zielPunkte: 3000, bergPunkte: 1500, matschPunkte: 257,
      faktoren: { rosen: 1, eicheln: 1, schilten: 2, schellen: 2, obenabe: 3, undenufe: 4 },
    },
    titel: ['Jasspapst', 'Jasskönig', 'Jassprinz', 'Jasslehrling'],
    abende: [],
    aktiv: null,
    kasse: [],
    sicherungNoetig: false,
  };
}

let daten = laden();
let seite = 'abend';
let ranglistenJahr = 'alle';

function laden() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (roh) return ergaenzen(JSON.parse(roh));
  } catch (e) { console.error(e); }
  return standardDaten();
}

// Ältere Daten um neue Felder ergänzen
function ergaenzen(geladen) {
  const std = standardDaten();
  const d = Object.assign(std, geladen);
  d.regeln = Object.assign({}, standardDaten().regeln, geladen.regeln);
  d.regeln.faktoren = Object.assign({}, standardDaten().regeln.faktoren, (geladen.regeln || {}).faktoren);
  if (d.aktiv) d.aktiv.laufend = Object.assign(neueLaufendePartie(), d.aktiv.laufend);
  return d;
}

function neueLaufendePartie() {
  return { ereignisse: [], punkte: ['', ''], spiele: [], start: null, richtung: 0 };
}

function speichern() {
  try {
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
  } catch (e) {
    alert('Speichern fehlgeschlagen: ' + e.message);
  }
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ---------- Hilfsfunktionen ----------

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const heute = () => new Date().toLocaleDateString('sv-SE');
const name = i => esc(daten.spieler[i]);
const paarName = paar => `${name(paar[0])} <span class="und">&</span> ${name(paar[1])}`;

function datumLang(iso) {
  return new Date(iso + 'T12:00').toLocaleDateString('de-CH', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}
function fr(betrag) {
  const s = Math.abs(betrag).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (betrag < 0 ? '−' : '') + 'Fr. ' + s;
}
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('sichtbar');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('sichtbar'), 2000);
}

// Striche wie auf der Jasstafel: Vierergruppen mit Querstrich
function strichBild(anzahl, hoehe = 56) {
  if (!anzahl) return `<span class="gedaempft">–</span>`;
  const abstand = 10, gruppe = 5 * abstand + 14;
  const gruppen = Math.ceil(anzahl / 5);
  const breite = gruppen * gruppe;
  let linien = '';
  for (let g = 0; g < gruppen; g++) {
    const inGruppe = Math.min(5, anzahl - g * 5);
    const x0 = g * gruppe + 4;
    for (let i = 0; i < Math.min(4, inGruppe); i++) {
      const x = x0 + i * abstand;
      linien += `<line x1="${x}" y1="4" x2="${x}" y2="${hoehe - 4}"/>`;
    }
    if (inGruppe === 5) linien += `<line x1="${x0 - 4}" y1="${hoehe * .2}" x2="${x0 + 3 * abstand + 4}" y2="${hoehe * .8}"/>`;
  }
  return `<svg width="${breite}" height="${hoehe}" viewBox="0 0 ${breite} ${hoehe}" stroke="#fff" stroke-width="3" stroke-linecap="round">${linien}</svg>`;
}

// Schweizer Jassfarben als kleine Zeichnungen
const FARBEN = ['rosen', 'schellen', 'schilten', 'eicheln'];
const FARB_SVG = {
  rosen: `<g stroke="#5a0d0f" stroke-width="1.2">
      ${[0, 72, 144, 216, 288].map(w => `<circle cx="${20 + 9 * Math.sin(w * Math.PI / 180)}" cy="${20 - 9 * Math.cos(w * Math.PI / 180)}" r="8" fill="#d8262c"/>`).join('')}
      <circle cx="20" cy="20" r="6" fill="#f2c230"/></g>`,
  schellen: `<g stroke="#6b4a00" stroke-width="1.4">
      <circle cx="20" cy="22" r="14" fill="#f2c230"/>
      <path d="M7 18 Q20 13 33 18 L33 21 Q20 16 7 21 Z" fill="#d8262c"/>
      <circle cx="20" cy="6" r="2.5" fill="#f2c230"/>
      <path d="M17 31 L23 31" stroke-width="2"/><circle cx="20" cy="27" r="2" fill="#6b4a00"/></g>`,
  schilten: `<g stroke="#222" stroke-width="1.4">
      <path d="M7 6 H33 V20 Q33 31 20 36 Q7 31 7 20 Z" fill="#f2c230"/>
      <path d="M7 6 H33 V14 H7 Z" fill="#d8262c"/>
      <path d="M20 14 V35" stroke="#2f6fbf" stroke-width="3"/></g>`,
  eicheln: `<g stroke="#3b2410" stroke-width="1.3">
      <path d="M20 2 V8" stroke-width="2.2"/>
      <ellipse cx="20" cy="25" rx="9" ry="11" fill="#e0b13a"/>
      <path d="M9 18 Q9 8 20 8 Q31 8 31 18 Z" fill="#7a4a1e"/>
      <path d="M12 12 L28 16 M12 16 L28 12" stroke="#4a2c10" stroke-width="1"/></g>`,
};
const farbe = (name, groesse = 28) => `<svg width="${groesse}" height="${groesse}" viewBox="0 0 40 40" role="img" aria-label="${name}">${FARB_SVG[name]}</svg>`;

// ---------- Berechnungen ----------

function teamStriche(partie, team) {
  return partie.ereignisse.filter(e => e.team === team).reduce((s, e) => s + e.wert, 0);
}

// Striche pro Spieler (Index 0–3) über alle Partien eines Abends
function spielerStriche(partien) {
  const s = [0, 0, 0, 0];
  for (const p of partien) {
    p.teams.forEach((paar, t) => {
      const n = teamStriche(p, t);
      paar.forEach(i => s[i] += n);
    });
  }
  return s;
}

// Jeder zahlt die Differenz zum Spieler mit den meisten Strichen
function beitraege(striche, franken) {
  const max = Math.max(...striche);
  return striche.map(n => (max - n) * franken);
}

// Sieger des Abends: alle mit den meisten Strichen; haben alle gleich viele, gibt es keinen
function abendSieger(striche) {
  const max = Math.max(...striche);
  if (striche.every(n => n === max)) return [];
  return striche.map((n, i) => n === max ? i : -1).filter(i => i >= 0);
}

function partieSieger(partie) {
  const ziel = partie.ereignisse.find(e => e.typ === 'ziel');
  return ziel ? ziel.team : null;
}

function kassenBewegungen() {
  const liste = [];
  for (const a of daten.abende) {
    const summe = a.beitraege.reduce((s, b) => s + b, 0);
    if (summe) liste.push({ datum: a.datum, betrag: summe, text: 'Jassabend', abend: a });
  }
  for (const k of daten.kasse) liste.push(k);
  return liste.sort((x, y) => y.datum.localeCompare(x.datum));
}

function kassenStand() {
  return kassenBewegungen().reduce((s, b) => s + b.betrag, 0);
}

// Bisher erfasste Orte, die häufigsten zuerst
function bekannteOrte() {
  const anzahl = {};
  for (const a of daten.abende) if (a.ort) anzahl[a.ort] = (anzahl[a.ort] || 0) + 1;
  return Object.keys(anzahl).sort((x, y) => anzahl[y] - anzahl[x] || x.localeCompare(y));
}

function ortListe() {
  return `<datalist id="orte">${bekannteOrte().map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
}

function aenderung() {
  daten.sicherungNoetig = true;
  speichern();
}

// ---------- Zählen ----------

const STICH_TOTAL = 157;
const STOECK = 20;
const TRUMPF = [
  { key: 'rosen', name: 'Rosen', farbe: true },
  { key: 'eicheln', name: 'Eicheln', farbe: true },
  { key: 'schilten', name: 'Schilten', farbe: true },
  { key: 'schellen', name: 'Schellen', farbe: true },
  { key: 'obenabe', name: 'Obenabe', symbol: '⬇' },
  { key: 'undenufe', name: 'Undenufe', symbol: '⬆' },
];
const trumpfInfo = key => TRUMPF.find(t => t.key === key);
const trumpfBild = (key, groesse = 26) => {
  const t = trumpfInfo(key);
  return t.farbe ? farbe(key, groesse) : `<span style="font-size:${groesse * .8}px;line-height:${groesse}px">${t.symbol}</span>`;
};

function spielPunkte(spiel) {
  return [0, 1].map(t => (spiel.stich[t] + spiel.weis[t] + (spiel.stoeck === t ? STOECK : 0)) * spiel.faktor);
}

// Zählt alle Spiele einer Partie zusammen und vergibt Berg-, Ziel- und Matsch-Striche.
// Reihenfolge innerhalb eines Spiels: Stöck → Stich → Weis.
// Kommen beide Teams im gleichen Schritt über eine Marke, gewinnt, wer danach mehr hat.
function auswerten(spiele) {
  const r = daten.regeln;
  const total = [0, 0];
  const ereignisse = [];
  let berg = null, ziel = null;
  const pruefen = teams => {
    for (const t of teams) {
      if (berg === null && total[t] >= r.bergPunkte) { berg = t; ereignisse.push({ team: t, typ: 'berg', wert: r.berg }); }
      if (ziel === null && total[t] >= r.zielPunkte) { ziel = t; ereignisse.push({ team: t, typ: 'ziel', wert: r.ziel }); }
    }
  };
  const beide = () => total[0] >= total[1] ? [0, 1] : [1, 0];
  for (const s of spiele) {
    if (s.stoeck !== null) { total[s.stoeck] += STOECK * s.faktor; pruefen([s.stoeck]); }
    total[0] += s.stich[0] * s.faktor; total[1] += s.stich[1] * s.faktor; pruefen(beide());
    if (s.matsch !== null) ereignisse.push({ team: s.matsch, typ: 'match', wert: r.match });
    total[0] += s.weis[0] * s.faktor; total[1] += s.weis[1] * s.faktor; pruefen(beide());
  }
  return { total, ereignisse, berg, ziel };
}

// Von Hand gesetzte Striche plus die aus dem Zählen; Berg und Ziel gibt es nur einmal
function alleEreignisse(l) {
  const auto = auswerten(l.spiele).ereignisse
    .filter(e => !(TYPEN[e.typ].einmalig && l.ereignisse.some(m => m.typ === e.typ)));
  return [...l.ereignisse, ...auto];
}

// Sitzordnung: die Partner sitzen sich gegenüber
function sitzordnung(teams, richtung) {
  const [a, b] = teams;
  return richtung ? [a[0], b[1], a[1], b[0]] : [a[0], b[0], a[1], b[1]];
}

function ansagerFuer(l, teams, spielNr) {
  if (l.start === null) return null;
  const ordnung = sitzordnung(teams, l.richtung);
  const i = ordnung.indexOf(l.start);
  return i < 0 ? null : ordnung[(i + spielNr) % 4];
}

const leeresFormular = () => ({ trumpf: null, stich: ['', ''], matsch: null, weis: [0, 0], stoeck: null, bearbeiten: null });
let formular = leeresFormular();
let ansicht = 'eingabe';   // 'eingabe' oder 'tafel'
let zurueckZurTafel = false;

function formularSpiel() {
  const f = formular;
  if (!f.trumpf) return { fehler: 'Bitte zuerst den Trumpf wählen.' };
  let stich;
  if (f.matsch !== null) {
    stich = f.matsch === 0 ? [daten.regeln.matschPunkte, 0] : [0, daten.regeln.matschPunkte];
  } else {
    stich = f.stich.map(Number);
    if (f.stich.some(x => x === '') || stich.some(x => !Number.isInteger(x) || x < 0) || stich[0] + stich[1] !== STICH_TOTAL) {
      return { fehler: `Die Stichpunkte müssen zusammen ${STICH_TOTAL} ergeben.` };
    }
  }
  return {
    spiel: {
      trumpf: f.trumpf,
      faktor: daten.regeln.faktoren[f.trumpf],
      stich,
      matsch: f.matsch,
      weis: f.weis.map(Number),
      stoeck: f.stoeck,
    },
  };
}

function spielEintragen() {
  const a = daten.aktiv, l = a.laufend;
  const { spiel, fehler } = formularSpiel();
  if (fehler) { alert(fehler); return; }
  if (formular.bearbeiten !== null) {
    spiel.ansager = l.spiele[formular.bearbeiten].ansager;
    l.spiele[formular.bearbeiten] = spiel;
  } else {
    const zielVorher = auswerten(l.spiele).ziel;
    spiel.ansager = ansagerFuer(l, a.teams, l.spiele.length);
    l.spiele.push(spiel);
    const ziel = auswerten(l.spiele).ziel;
    if (zielVorher === null && ziel !== null) {
      setTimeout(() => toast(`${daten.spieler[a.teams[ziel][0]]} & ${daten.spieler[a.teams[ziel][1]]} haben ${daten.regeln.zielPunkte} erreicht!`), 50);
    }
  }
  formular = leeresFormular();
  if (zurueckZurTafel) { ansicht = 'tafel'; zurueckZurTafel = false; window.scrollTo(0, 0); }
  speichern();
  zeichnen();
}

// ---------- Jasstafel ----------

// Punkte wie auf der Tafel aufteilen: 100er oben, ein 50er auf der Diagonale, 20er unten, Rest als Zahl
function tafelWerte(punkte) {
  let rest = punkte;
  const hunderter = Math.floor(rest / 100); rest -= hunderter * 100;
  const fuenfziger = Math.floor(rest / 50); rest -= fuenfziger * 50;
  const zwanziger = Math.floor(rest / 20); rest -= zwanziger * 20;
  return { hunderter, fuenfziger, zwanziger, rest };
}

// Senkrechte Striche entlang einer Linie: je zehn als X, dann Fünfergruppen (vier Striche, einer quer), dann einzelne
function strichReihe(anzahl, x0, y, h) {
  let x = x0, svg = '';
  const strich = xx => `<line x1="${xx}" y1="${y - h}" x2="${xx}" y2="${y + h}"/>`;
  for (let i = 0; i < Math.floor(anzahl / 10); i++) {
    svg += `<line x1="${x}" y1="${y - h}" x2="${x + 30}" y2="${y + h}"/><line x1="${x + 30}" y1="${y - h}" x2="${x}" y2="${y + h}"/>`;
    x += 64;
  }
  const rest = anzahl % 10;
  for (let g = 0; g < Math.floor(rest / 5); g++) {
    for (let i = 0; i < 4; i++) svg += strich(x + i * 14);
    svg += `<line x1="${x - 8}" y1="${y - h * .7}" x2="${x + 50}" y2="${y + h * .7}"/>`;
    x += 86;
  }
  for (let i = 0; i < rest % 5; i++) { svg += strich(x); x += 14; }
  return svg;
}

function tafelHaelfte(a, t, gedreht, total, striche) {
  const w = tafelWerte(total);
  const L = 220, R = 780, O = 70, U = 330;
  // 50er quer zur Diagonale, vom unteren linken Ende her
  const dx = R - L, dy = O - U, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, px = -uy, py = ux;
  let fuenfziger = '';
  for (let i = 0; i < w.fuenfziger; i++) {
    const cx = L + ux * len * (.18 + i * .07), cy = U + uy * len * (.18 + i * .07);
    fuenfziger += `<line x1="${cx - px * 38}" y1="${cy - py * 38}" x2="${cx + px * 38}" y2="${cy + py * 38}"/>`;
  }
  const [n1, n2] = a.teams[t].map(i => esc(daten.spieler[i]));
  return `
    <svg viewBox="0 0 1000 400" role="img" aria-label="Tafel ${n1} und ${n2}: ${total} Punkte">
      <g ${gedreht ? 'transform="rotate(180 500 200)"' : ''}>
        <text x="500" y="250" text-anchor="middle" font-size="150" font-weight="600" fill="#2a2a2a">${total}</text>
        <path d="M${L} ${O} H${R} L${L} ${U} H${R}" fill="none" stroke="#e0262b" stroke-width="4" stroke-linejoin="round"/>
        <g stroke="#fff" stroke-width="4" stroke-linecap="round">
          ${strichReihe(w.hunderter, L + 14, O, 38)}
          ${fuenfziger}
          ${strichReihe(w.zwanziger, L + 14, U, 38)}
        </g>
        <text x="${R + 40}" y="${U + 18}" font-size="60" fill="#fff">${w.rest || ''}</text>
        <text x="20" y="${U - 50}" font-size="30" font-weight="600" fill="#f2f2f2">${n1}</text>
        <text x="20" y="${U - 12}" font-size="30" font-weight="600" fill="#f2f2f2">${n2}</text>
        ${striche ? `<text x="20" y="${O + 20}" font-size="24" fill="#8a8a8a">${striche} ${striche === 1 ? 'Strich' : 'Striche'}</text>` : ''}
      </g>
    </svg>`;
}

function tafelAnsicht(a) {
  const l = a.laufend;
  const stand = auswerten(l.spiele);
  const ereignisse = alleEreignisse(l);
  const striche = t => ereignisse.filter(e => e.team === t).reduce((s, e) => s + e.wert, 0);
  const ansager = ansagerFuer(l, a.teams, l.spiele.length);
  return `
    <div class="tafel-leiste">
      ${umschalter()}
      <span class="ansager">${stand.ziel !== null ? `🏆 <strong>${paarName(a.teams[stand.ziel])}</strong> haben ${daten.regeln.zielPunkte} erreicht`
        : ansager !== null ? `Ansagen: <strong>${name(ansager)}</strong>` : `Partie ${a.partien.length + 1} · Spiel ${l.spiele.length + 1}`}</span>
      ${stand.ziel !== null
        ? `<button class="primaer" data-aktion="partie-abschliessen">Partie abschliessen</button>`
        : `<button class="primaer" data-aktion="zur-eingabe">+ Spiel eintragen</button>`}
    </div>
    <div class="tafel-ansicht">
      ${tafelHaelfte(a, 1, true, stand.total[1], striche(1))}
      <div class="tafel-trenner"></div>
      ${tafelHaelfte(a, 0, false, stand.total[0], striche(0))}
    </div>`;
}

function umschalter() {
  return `<div class="umschalter">
    <button class="${ansicht === 'eingabe' ? 'aktiv' : ''}" data-aktion="ansicht" data-ansicht="eingabe">Eingabe</button>
    <button class="${ansicht === 'tafel' ? 'aktiv' : ''}" data-aktion="ansicht" data-ansicht="tafel">Tafel</button>
  </div>`;
}

// ---------- Teams auslosen ----------

const PAARUNGEN = [
  [[0, 1], [2, 3]],
  [[0, 2], [1, 3]],
  [[0, 3], [1, 2]],
];

function gleichePaarung(a, b) {
  const schluessel = t => t.map(p => [...p].sort().join()).sort().join('|');
  return a && b && schluessel(a) === schluessel(b);
}

function zufallsTeams(bisher) {
  // Nicht zweimal hintereinander die gleiche Paarung
  const moeglich = PAARUNGEN.filter(p => !gleichePaarung(p, bisher));
  const wahl = moeglich[Math.floor(Math.random() * moeglich.length)];
  // Seiten und Reihenfolge zufällig, damit es nicht immer gleich aussieht
  const teams = wahl.map(p => Math.random() < .5 ? [...p] : [p[1], p[0]]);
  return Math.random() < .5 ? teams : teams.reverse();
}

function auslosen() {
  const a = daten.aktiv;
  if ((a.laufend.ereignisse.length || a.laufend.spiele.length) && !confirm('In dieser Partie ist schon etwas eingetragen. Trotzdem neu auslosen? Punkte und Striche gehen dann an die neuen Teams.')) return;
  const ziel = zufallsTeams(a.teams);
  let runden = 0;
  const box = $('#los');
  box.classList.add('mischen');
  const timer = setInterval(() => {
    const t = zufallsTeams();
    $('#los-a').innerHTML = paarName(t[0]);
    $('#los-b').innerHTML = paarName(t[1]);
    if (++runden >= 12) {
      clearInterval(timer);
      a.teams = ziel;
      speichern();
      zeichnen();
    }
  }, 90);
}

// ---------- Aktionen am Abend ----------

function neuerAbend() {
  daten.aktiv = {
    id: id(),
    datum: heute(),
    ort: '',
    teams: zufallsTeams(),
    partien: [],
    laufend: neueLaufendePartie(),
  };
  formular = leeresFormular();
  speichern();
  zeichnen();
}

function strichDazu(team, typ) {
  const l = daten.aktiv.laufend;
  if (TYPEN[typ].einmalig && alleEreignisse(l).some(e => e.typ === typ)) return;
  l.ereignisse.push({ team, typ, wert: daten.regeln[typ] });
  speichern();
  zeichnen();
}

function strichWeg(team) {
  const l = daten.aktiv.laufend;
  for (let i = l.ereignisse.length - 1; i >= 0; i--) {
    if (l.ereignisse[i].team === team) { l.ereignisse.splice(i, 1); break; }
  }
  speichern();
  zeichnen();
}

function partieAbschliessen() {
  const a = daten.aktiv;
  const l = a.laufend;
  const ereignisse = alleEreignisse(l);
  if (!ereignisse.length && !confirm('Diese Partie hat keine Striche. Trotzdem abschliessen?')) return;
  if (!ereignisse.some(e => e.typ === 'ziel') && !confirm(`Noch kein Team hat das Ziel (${daten.regeln.zielPunkte}) erreicht. Trotzdem abschliessen?`)) return;
  a.partien.push({
    teams: a.teams.map(p => [...p]),
    ereignisse,
    punkte: l.spiele.length ? auswerten(l.spiele).total : l.punkte.map(p => p === '' ? null : Number(p)),
    spiele: l.spiele,
  });
  a.laufend = Object.assign(neueLaufendePartie(), { richtung: l.richtung });
  formular = leeresFormular();
  speichern();
  zeichnen();
  toast(`Partie ${a.partien.length} gespeichert`);
}

function partieLoeschen(index) {
  if (!confirm(`Partie ${index + 1} wirklich löschen?`)) return;
  daten.aktiv.partien.splice(index, 1);
  speichern();
  zeichnen();
}

function abendAbschliessen() {
  const a = daten.aktiv;
  if (a.laufend.ereignisse.length || a.laufend.spiele.length) {
    alert('In der laufenden Partie ist noch etwas eingetragen. Bitte zuerst «Partie abschliessen» oder die Einträge entfernen.');
    return;
  }
  if (!a.partien.length) {
    if (confirm('Es wurde keine Partie gespielt. Abend verwerfen?')) { daten.aktiv = null; speichern(); zeichnen(); }
    return;
  }
  const striche = spielerStriche(a.partien);
  const b = beitraege(striche, daten.regeln.franken);
  const text = daten.spieler.map((n, i) => `${n}: ${striche[i]} Striche → ${fr(b[i])}`).join('\n');
  if (!confirm(`Abend abschliessen?\n\n${text}\n\nTotal in die Jasskasse: ${fr(b.reduce((s, x) => s + x, 0))}`)) return;
  daten.abende.push({
    id: a.id,
    datum: a.datum,
    ort: (a.ort || '').trim(),
    partien: a.partien,
    striche,
    beitraege: b,
    sieger: abendSieger(striche),
  });
  daten.aktiv = null;
  aenderung();
  seite = 'chronik';
  zeichnen();
  toast('Abend gespeichert');
}

// ---------- Seiten ----------

function seiteAbend() {
  const a = daten.aktiv;
  if (!a) {
    const letzter = [...daten.abende].sort((x, y) => y.datum.localeCompare(x.datum))[0];
    return `
      <div class="karte leer stapel">
        <div class="farben">${FARBEN.map(f => farbe(f, 64)).join('')}</div>
        <p>${letzter ? `Letzter Jassabend: ${datumLang(letzter.datum)}${letzter.ort ? ' im ' + esc(letzter.ort) : ''}` : 'Noch kein Jassabend erfasst.'}</p>
        <button class="primaer gross" data-aktion="neuer-abend">Neuen Jassabend starten</button>
      </div>`;
  }

  if (ansicht === 'tafel') return tafelAnsicht(a);

  const l = a.laufend;
  const r = daten.regeln;
  const ereignisse = alleEreignisse(l);
  const bergVergeben = ereignisse.some(e => e.typ === 'berg');
  const zielVergeben = ereignisse.some(e => e.typ === 'ziel');
  const laufendePartie = { teams: a.teams, ereignisse };
  const stand = auswerten(l.spiele);
  const alle = [...a.partien, laufendePartie];
  const striche = spielerStriche(alle);
  const b = beitraege(striche, r.franken);
  const max = Math.max(...striche);
  const reihenfolge = [0, 1, 2, 3].sort((x, y) => striche[y] - striche[x]);

  const teamFeld = t => {
    const n = teamStriche(laufendePartie, t);
    const details = Object.keys(TYPEN)
      .map(typ => [typ, ereignisse.filter(e => e.team === t && e.typ === typ).length])
      .filter(([, k]) => k)
      .map(([typ, k]) => `<span class="marke ${typ === 'ziel' ? 'gold' : ''}">${TYPEN[typ].name}${k > 1 ? ' ×' + k : ''}</span>`)
      .join(' ');
    return `
      <div class="karte team ${partieSieger(laufendePartie) === t ? 'sieger' : ''}">
        <div class="zeile weit">
          <div class="namen">${paarName(a.teams[t])}</div>
          <div class="summe zahl">${n}</div>
        </div>
        <div class="tafel">${strichBild(n)}</div>
        <div class="zeile" style="min-height:26px;margin-bottom:12px">${details}</div>
        <div class="knoepfe">
          <button data-aktion="strich" data-team="${t}" data-typ="berg" ${bergVergeben ? 'disabled' : ''}>Berg<small>+${r.berg}</small></button>
          <button data-aktion="strich" data-team="${t}" data-typ="match">Match<small>+${r.match}</small></button>
          <button data-aktion="strich" data-team="${t}" data-typ="ziel" ${zielVergeben ? 'disabled' : ''}>${r.zielPunkte}<small>+${r.ziel}</small></button>
        </div>
        <div class="zeile weit" style="margin-top:12px">
          ${l.spiele.length ? `<span class="gedaempft klein-text">${stand.total[t]} Punkte</span>` : `
          <label class="zeile gedaempft klein-text">Punkte
            <input type="number" inputmode="numeric" data-punkte="${t}" value="${esc(l.punkte[t])}" placeholder="optional">
          </label>`}
          <button class="klein" data-aktion="strich-weg" data-team="${t}" ${l.ereignisse.some(e => e.team === t) ? '' : 'disabled'}>↶ Letzten Strich weg</button>
        </div>
      </div>`;
  };

  const partienListe = a.partien.length ? `
    <table>
      <tr><th>#</th><th>Teams</th><th class="rechts">Punkte</th><th class="rechts">Striche</th><th></th></tr>
      ${a.partien.map((p, i) => {
        const s = partieSieger(p);
        return `<tr>
          <td>${i + 1}</td>
          <td>${p.teams.map((paar, t) => `<span style="${s === t ? 'color:var(--gold)' : ''}">${paarName(paar)}</span>`).join('<br>')}</td>
          <td class="rechts zahl">${p.punkte.map(x => x ?? '–').join('<br>')}</td>
          <td class="rechts zahl">${teamStriche(p, 0)}<br>${teamStriche(p, 1)}</td>
          <td class="rechts"><button class="link" data-aktion="partie-loeschen" data-index="${i}">✕</button></td>
        </tr>`;
      }).join('')}
    </table>` : '<p class="hinweis">Noch keine Partie abgeschlossen.</p>';

  return `
    <div class="stapel">
      <div class="zeile weit">
        <div class="zeile">
          ${umschalter()}
          <input type="date" id="abend-datum" value="${a.datum}" max="${heute()}">
          <input type="text" id="abend-ort" list="orte" value="${esc(a.ort || '')}" placeholder="Ort, z.B. Restaurant" autocomplete="off" style="width:240px">
          ${ortListe()}
        </div>
        <button data-aktion="abend-abschliessen">Abend abschliessen</button>
      </div>
      ${bekannteOrte().length ? `<div class="orte">${bekannteOrte().slice(0, 8).map(o =>
        `<button class="klein ${o === a.ort ? 'gewaehlt' : ''}" data-aktion="ort-waehlen" data-ort="${esc(o)}">📍 ${esc(o)}</button>`).join('')}</div>` : ''}

      <div class="gitter-abend">
        <div class="stapel">
          <div class="karte">
            <div class="zeile weit">
              <h3 style="margin:0">Partie ${a.partien.length + 1}</h3>
              <button data-aktion="auslosen">🎲 Teams neu auslosen</button>
            </div>
            <div class="los-anzeige" id="los">
              <div class="paar" id="los-a">${paarName(a.teams[0])}</div>
              <div class="vs">gegen</div>
              <div class="paar" id="los-b">${paarName(a.teams[1])}</div>
            </div>
          </div>
          ${zaehler(a)}
          <div class="gitter2">${teamFeld(0)}${teamFeld(1)}</div>
          <button class="primaer gross" style="width:100%" data-aktion="partie-abschliessen">Partie abschliessen</button>
          <div class="karte">
            <h3>Gespielte Partien</h3>
            ${partienListe}
          </div>
        </div>

        <div class="karte">
          <h3>Zwischenstand</h3>
          <table>
            <tr><th>Spieler</th><th class="rechts">Striche</th><th class="rechts">Kasse</th></tr>
            ${reihenfolge.map(i => `
              <tr>
                <td>${striche[i] === max && max > 0 ? '👑 ' : ''}${name(i)}</td>
                <td class="rechts zahl">${striche[i]}</td>
                <td class="rechts zahl ${b[i] ? 'negativ' : ''}">${b[i] ? fr(b[i]) : '–'}</td>
              </tr>`).join('')}
          </table>
          <p class="hinweis">Jeder zahlt pro Strich Rückstand auf den Besten ${fr(r.franken)} in die Jasskasse. Die laufende Partie ist mitgezählt.</p>
        </div>
      </div>
    </div>`;
}

function zaehler(a) {
  const l = a.laufend;
  const r = daten.regeln;
  const f = formular;
  const stand = auswerten(l.spiele);
  const nr = f.bearbeiten !== null ? f.bearbeiten : l.spiele.length;
  const ansager = f.bearbeiten !== null ? l.spiele[f.bearbeiten].ansager : ansagerFuer(l, a.teams, l.spiele.length);
  const ohneStoeck = f.trumpf === 'obenabe' || f.trumpf === 'undenufe';
  const vorschau = formularSpiel().spiel;

  const ansagerZeile = l.start === null ? `
    <div class="zeile">
      <span class="gedaempft">Wer hat die Rosen 10?</span>
      ${[...a.teams[0], ...a.teams[1]].map(i => `<button class="klein" data-aktion="start" data-spieler="${i}">${name(i)}</button>`).join('')}
    </div>` : `
    <div class="zeile ansager">
      <span>Ansagen: <strong>${ansager === null ? '–' : name(ansager)}</strong></span>
      <span class="gedaempft klein-text">Reihenfolge: ${sitzordnung(a.teams, l.richtung).map(name).join(' → ')}</span>
      <button class="klein" data-aktion="richtung" title="Andere Richtung">⇄</button>
      <button class="link klein-text" data-aktion="start-zuruecksetzen">ändern</button>
    </div>`;

  const team = t => `
    <div class="eingabe-team stapel">
      <div class="namen">${paarName(a.teams[t])}</div>
      <input type="number" inputmode="numeric" data-stich="${t}" value="${f.matsch !== null ? (f.matsch === t ? r.matschPunkte : 0) : esc(f.stich[t])}"
        placeholder="Stichpunkte" ${f.matsch !== null ? 'disabled' : ''}>
      <div class="weis">
        <button class="${f.matsch === t ? 'gewaehlt' : ''}" data-aktion="matsch" data-team="${t}">Matsch</button>
        <button class="${f.stoeck === t ? 'gewaehlt' : ''}" data-aktion="stoeck" data-team="${t}" ${ohneStoeck ? 'disabled' : ''}>Stöck</button>
      </div>
      <div class="weis">
        <span class="gedaempft klein-text">Weis</span>
        ${[20, 50, 100, 150, 200].map(w => `<button data-aktion="weis" data-team="${t}" data-wert="${w}">+${w}</button>`).join('')}
      </div>
      <div class="weis">
        <span class="gedaempft klein-text">Summe Weis</span>
        <input type="number" inputmode="numeric" data-weis="${t}" value="${f.weis[t] || ''}" placeholder="0" style="width:90px;font-size:17px">
        ${f.weis[t] ? `<button class="link" data-aktion="weis-weg" data-team="${t}">✕</button>` : ''}
      </div>
    </div>`;

  const liste = l.spiele.length ? `
    <table>
      <tr><th>#</th><th>Trumpf</th><th>Ansage</th><th class="rechts">${paarName(a.teams[0])}</th><th class="rechts">${paarName(a.teams[1])}</th><th></th></tr>
      ${(() => {
        const summe = [0, 0];
        return l.spiele.map((s, i) => {
          const p = spielPunkte(s);
          summe[0] += p[0]; summe[1] += p[1];
          const extra = t => [s.matsch === t ? 'Matsch' : '', s.weis[t] ? `Weis ${s.weis[t]}` : '', s.stoeck === t ? 'Stöck' : ''].filter(Boolean).join(', ');
          return `<tr class="klickbar ${f.bearbeiten === i ? 'bearbeitet' : ''}" data-aktion="spiel-bearbeiten" data-index="${i}">
            <td>${i + 1}</td>
            <td><span class="zeile" style="gap:6px">${trumpfBild(s.trumpf, 20)} ×${s.faktor}</span></td>
            <td class="gedaempft">${s.ansager === null || s.ansager === undefined ? '' : name(s.ansager)}</td>
            <td class="rechts zahl">+${p[0]} <span class="gedaempft klein-text">${extra(0)}</span><br><strong>${summe[0]}</strong></td>
            <td class="rechts zahl">+${p[1]} <span class="gedaempft klein-text">${extra(1)}</span><br><strong>${summe[1]}</strong></td>
            <td class="rechts"><button class="link" data-aktion="spiel-loeschen" data-index="${i}">✕</button></td>
          </tr>`;
        }).join('');
      })()}
    </table>` : '';

  const balken = t => `
    <div>
      <div class="zeile weit"><span>${paarName(a.teams[t])}</span><strong class="zahl" style="font-size:24px">${stand.total[t]}</strong></div>
      <div class="balken">
        <div style="width:${Math.min(100, stand.total[t] / r.zielPunkte * 100)}%"></div>
        <span class="berg-marke" style="left:${r.bergPunkte / r.zielPunkte * 100}%"></span>
      </div>
    </div>`;

  return `
    <div class="karte stapel" id="zaehler">
      <div class="zeile weit">
        <h3 style="margin:0">${f.bearbeiten !== null ? `Spiel ${nr + 1} bearbeiten` : `Spiel ${nr + 1}`}</h3>
        ${ansagerZeile}
      </div>
      ${l.spiele.length ? `<div class="gitter2">${balken(0)}${balken(1)}</div>` : ''}
      ${stand.ziel !== null && f.bearbeiten === null ? `
      <div class="banner" style="margin:0">
        <span>🏆 <strong>${paarName(a.teams[stand.ziel])}</strong> haben ${r.zielPunkte} erreicht.</span>
        <button class="primaer" data-aktion="partie-abschliessen">Partie abschliessen</button>
      </div>` : `
      <div class="trumpf">
        ${TRUMPF.map(t => `<button class="${f.trumpf === t.key ? 'gewaehlt' : ''}" data-aktion="trumpf" data-trumpf="${t.key}">
          ${trumpfBild(t.key)}<span>${t.name}</span><small>×${r.faktoren[t.key]}</small></button>`).join('')}
      </div>
      <div class="gitter2">${team(0)}${team(1)}</div>
      <div class="vorschau" id="vorschau">${vorschauText(a, vorschau)}</div>
      <div class="zeile">
        <button class="primaer gross" style="flex:1" data-aktion="spiel-eintragen">${f.bearbeiten !== null ? 'Änderung speichern' : 'Spiel eintragen'}</button>
        ${f.bearbeiten !== null || f.trumpf ? `<button class="gross" data-aktion="formular-leeren">Abbrechen</button>` : ''}
      </div>`}
      ${liste}
    </div>`;
}

function vorschauText(a, spiel) {
  if (!spiel) return '<span class="gedaempft klein-text">Trumpf wählen, Stichpunkte eines Teams eintippen – das andere Team bekommt den Rest auf 157.</span>';
  const p = spielPunkte(spiel);
  return `${paarName(a.teams[0])} <strong>+${p[0]}</strong> &nbsp;·&nbsp; ${paarName(a.teams[1])} <strong>+${p[1]}</strong>`;
}

function seiteChronik() {
  if (!daten.abende.length) return `<div class="karte leer">Noch keine Jassabende in der Chronik.</div>`;
  const abende = [...daten.abende].sort((x, y) => y.datum.localeCompare(x.datum));
  let jahr = null;
  return `
    <h2>Chronik <span class="gedaempft" style="font-weight:400">· ${abende.length} Abende</span></h2>
    ${ortListe()}
    ${abende.map(a => {
      const neuesJahr = a.datum.slice(0, 4) !== jahr;
      jahr = a.datum.slice(0, 4);
      const kopf = neuesJahr ? `<h2 class="jahr">${jahr} <span class="gedaempft" style="font-weight:400">· ${abende.filter(x => x.datum.startsWith(jahr)).length}× gejasst</span></h2>` : '';
      const summe = a.beitraege.reduce((s, x) => s + x, 0);
      const reihenfolge = [0, 1, 2, 3].sort((x, y) => a.striche[y] - a.striche[x]);
      return `${kopf}
      <details class="abend">
        <summary>
          <strong>${datumLang(a.datum)}</strong>
          ${a.ort ? `<span>📍 ${esc(a.ort)}</span>` : ''}
          <span class="gedaempft">${a.partien.length} Partien</span>
          <span>${a.sieger.length ? '👑 ' + a.sieger.map(name).join(', ') : 'Unentschieden'}</span>
          <span style="margin-left:auto" class="zahl">${fr(summe)}</span>
        </summary>
        <div class="inhalt stapel">
          <div class="gitter2">
            <table>
              <tr><th>Spieler</th><th class="rechts">Striche</th><th class="rechts">Kasse</th></tr>
              ${reihenfolge.map(i => `<tr><td>${a.sieger.includes(i) ? '👑 ' : ''}${name(i)}</td><td class="rechts zahl">${a.striche[i]}</td><td class="rechts zahl">${a.beitraege[i] ? fr(a.beitraege[i]) : '–'}</td></tr>`).join('')}
            </table>
            <table>
              <tr><th>#</th><th>Teams</th><th class="rechts">Punkte</th><th class="rechts">Striche</th></tr>
              ${a.partien.map((p, i) => {
                const s = partieSieger(p);
                return `<tr><td>${i + 1}</td>
                  <td>${p.teams.map((paar, t) => `<span style="${s === t ? 'color:var(--gold)' : ''}">${paarName(paar)}</span>`).join('<br>')}</td>
                  <td class="rechts zahl">${p.punkte.map(x => x ?? '–').join('<br>')}</td>
                  <td class="rechts zahl">${teamStriche(p, 0)}<br>${teamStriche(p, 1)}</td></tr>`;
              }).join('')}
            </table>
          </div>
          <div class="zeile weit">
            <label class="zeile gedaempft klein-text">Ort
              <input type="text" list="orte" data-ort-abend="${a.id}" value="${esc(a.ort || '')}" placeholder="Ort" autocomplete="off">
            </label>
            <button class="link" data-aktion="abend-loeschen" data-id="${a.id}">Abend löschen</button>
          </div>
        </div>
      </details>`;
    }).join('')}`;
}

function seiteRangliste() {
  const jahre = [...new Set(daten.abende.map(a => a.datum.slice(0, 4)))].sort().reverse();
  if (ranglistenJahr !== 'alle' && !jahre.includes(ranglistenJahr)) ranglistenJahr = 'alle';
  const abende = daten.abende.filter(a => ranglistenJahr === 'alle' || a.datum.startsWith(ranglistenJahr));
  const werte = rangliste(abende);
  const symbole = ['👑', '🤴', '🎩', '🃏'];
  const jahresTabelle = jahresUebersicht(jahre);

  return `
    <div class="zeile weit" style="margin-bottom:12px">
      <h2 style="margin:0">Rangliste</h2>
      <select id="rangliste-jahr">
        <option value="alle">Ewige Tabelle</option>
        ${jahre.map(j => `<option value="${j}" ${j === ranglistenJahr ? 'selected' : ''}>${j}</option>`).join('')}
      </select>
    </div>
    ${!abende.length ? '<div class="karte leer">Noch keine Jassabende.</div>' : `
    <div class="karte">
      <table>
        <tr><th></th><th>Titel</th><th>Spieler</th><th class="rechts">Abendsiege</th><th class="rechts">Partien gewonnen</th><th class="rechts">Striche</th><th class="rechts">Einbezahlt</th></tr>
        ${werte.map(w => `
          <tr>
            <td class="titel-rang">${symbole[w.rang]}</td>
            <td><strong>${esc(daten.titel[w.rang])}</strong></td>
            <td>${name(w.i)}</td>
            <td class="rechts zahl">${w.siege} / ${w.abende}</td>
            <td class="rechts zahl">${w.partienGewonnen} / ${w.partien}</td>
            <td class="rechts zahl">${w.striche}</td>
            <td class="rechts zahl">${fr(w.bezahlt)}</td>
          </tr>`).join('')}
      </table>
      <p class="hinweis">Reihenfolge: zuerst Abendsiege, dann Striche total, dann wer weniger einbezahlt hat. Bei Gleichstand am Abend zählt der Sieg für alle mit den meisten Strichen.</p>
    </div>
    ${jahresTabelle}`}`;
}

function jahresUebersicht(jahre) {
  return `
    <div class="karte" style="margin-top:16px">
      <h3>Jahresübersicht</h3>
      <table>
        <tr><th>Jahr</th><th class="rechts">Abende</th><th class="rechts">Partien</th><th>Meist gejasst im</th><th>${esc(daten.titel[0])}</th><th class="rechts">In die Kasse</th></tr>
        ${jahre.map(j => {
          const abende = daten.abende.filter(a => a.datum.startsWith(j));
          const orte = {};
          abende.forEach(a => { if (a.ort) orte[a.ort] = (orte[a.ort] || 0) + 1; });
          const lieblingsort = Object.keys(orte).sort((x, y) => orte[y] - orte[x])[0];
          const erste = rangliste(abende).filter(w => w.rang === 0).map(w => name(w.i));
          return `<tr>
            <td><strong>${j}</strong></td>
            <td class="rechts zahl">${abende.length}</td>
            <td class="rechts zahl">${abende.reduce((n, a) => n + a.partien.length, 0)}</td>
            <td>${lieblingsort ? `${esc(lieblingsort)} <span class="gedaempft">(${orte[lieblingsort]}×)</span>` : '–'}</td>
            <td>${erste.join(', ')}</td>
            <td class="rechts zahl">${fr(abende.reduce((n, a) => n + a.beitraege.reduce((s, x) => s + x, 0), 0))}</td>
          </tr>`;
        }).join('')}
      </table>
    </div>`;
}

function rangliste(abende) {
  const werte = [0, 1, 2, 3].map(i => ({ i, siege: 0, striche: 0, partien: 0, partienGewonnen: 0, bezahlt: 0, abende: 0 }));
  for (const a of abende) {
    a.sieger.forEach(i => werte[i].siege++);
    a.striche.forEach((n, i) => { werte[i].striche += n; werte[i].abende++; });
    a.beitraege.forEach((x, i) => werte[i].bezahlt += x);
    for (const p of a.partien) {
      const s = partieSieger(p);
      p.teams.forEach((paar, t) => paar.forEach(i => {
        werte[i].partien++;
        if (s === t) werte[i].partienGewonnen++;
      }));
    }
  }
  werte.sort((x, y) => y.siege - x.siege || y.striche - x.striche || x.bezahlt - y.bezahlt);

  // Gleiche Werte → gleicher Rang
  let rang = 0;
  werte.forEach((w, k) => {
    const vorher = werte[k - 1];
    if (!vorher || vorher.siege !== w.siege || vorher.striche !== w.striche || vorher.bezahlt !== w.bezahlt) rang = k;
    w.rang = rang;
  });
  return werte;
}

function seiteKasse() {
  const bewegungen = kassenBewegungen();
  const stand = kassenStand();
  const proSpieler = [0, 0, 0, 0];
  daten.abende.forEach(a => a.beitraege.forEach((x, i) => proSpieler[i] += x));
  const reihenfolge = [0, 1, 2, 3].sort((x, y) => proSpieler[y] - proSpieler[x]);

  return `
    <div class="gitter2">
      <div class="karte stapel">
        <div>
          <h3>Stand Jasskasse</h3>
          <div class="kasse-stand zahl ${stand < 0 ? 'negativ' : ''}">${fr(stand)}</div>
        </div>
        <table>
          <tr><th>Beitrag aus Jassabenden</th><th class="rechts"></th></tr>
          ${reihenfolge.map(i => `<tr><td>${name(i)}</td><td class="rechts zahl">${fr(proSpieler[i])}</td></tr>`).join('')}
        </table>
      </div>
      <div class="karte stapel">
        <h3>Ausgabe oder Einzahlung erfassen</h3>

          <input type="date" id="k-datum" value="${heute()}">

        <div class="zeile">
          <button data-aktion="kasse-dazu" data-richtung="-1">− Ausgabe</button>
          <button data-aktion="kasse-dazu" data-richtung="1">+ Einzahlung</button>
        </div>
      </div>
    </div>
    <div class="karte" style="margin-top:16px">
      <h3>Bewegungen</h3>
      ${bewegungen.length ? `<table>
        ${bewegungen.map(b => `<tr>
          <td class="gedaempft">${datumLang(b.datum)}</td>
          <td>${esc(b.text)}</td>
          <td class="rechts zahl ${b.betrag < 0 ? 'negativ' : 'positiv'}">${b.betrag > 0 ? '+' : ''}${fr(b.betrag)}</td>
          <td class="rechts">${b.abend ? '' : `<button class="link" data-aktion="kasse-loeschen" data-id="${b.id}">✕</button>`}</td>
        </tr>`).join('')}
      </table>` : '<p class="hinweis">Noch keine Bewegungen.</p>'}
    </div>`;
}

function seiteEinstellungen() {
  const r = daten.regeln;
  return `
    <div class="gitter2">
      <div class="karte stapel">
        <h3>Spieler</h3>
        ${daten.spieler.map((n, i) => `<input type="text" data-spieler="${i}" value="${esc(n)}" style="width:100%">`).join('')}
        <h3 style="margin-top:20px">Titel in der Rangliste</h3>
        ${daten.titel.map((t, i) => `<div class="zeile"><span class="gedaempft" style="width:30px">${i + 1}.</span><input type="text" data-titel="${i}" value="${esc(t)}" style="flex:1"></div>`).join('')}
      </div>

          <div class="zeile weit"><span>Franken pro Strich</span><input type="number" step="0.5" data-regel="franken" value="${r.franken}"></div>
          <p class="hinweis">Änderungen gelten für neue Striche. Bereits gespeicherte Abende bleiben, wie sie waren.</p>

            <input type="number" min="1" data-faktor="${t.key}" value="${r.faktoren[t.key]}"></div>`).join('')}
          <p class="hinweis">Der Faktor gilt für Stichpunkte, Matsch, Weis und Stöck.</p>

          <div class="zeile">
            <button data-aktion="export">Sicherung speichern</button>
            <button data-aktion="import">Sicherung laden</button>

// ---------- Sicherung ----------

async function exportieren() {
  const json = JSON.stringify(daten, null, 2);
  // Immer gleicher Name, damit «In Dateien sichern» die alte Sicherung ersetzen kann
  const dateiname = 'Jassabend-Sicherung.json';
  const datei = new File([json], dateiname, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei], title: dateiname }); }
    catch (e) { return; }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(datei);
    a.download = dateiname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  daten.sicherungNoetig = false;
  speichern();
  zeichnen();
  toast('Sicherung gespeichert');
}

function importieren(datei) {
  const leser = new FileReader();
  leser.onload = () => {
    try {
      const neu = JSON.parse(leser.result);
      if (!Array.isArray(neu.abende) || !Array.isArray(neu.spieler)) throw new Error('Keine Jassabend-Sicherung');
      if (!confirm(`Sicherung mit ${neu.abende.length} Abenden laden? Die aktuellen Daten auf diesem iPad werden ersetzt.`)) return;
      daten = ergaenzen(Object.assign(neu, { sicherungNoetig: false }));
      speichern();
      zeichnen();
      toast('Sicherung geladen');
    } catch (e) {
      alert('Die Datei konnte nicht geladen werden: ' + e.message);
    }
  };
  leser.readAsText(datei);
}

// ---------- Darstellung und Ereignisse ----------

const SEITEN = { abend: seiteAbend, chronik: seiteChronik, rangliste: seiteRangliste, kasse: seiteKasse, einstellungen: seiteEinstellungen };

function zeichnen() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('aktiv', b.dataset.seite === seite));
  const banner = daten.sicherungNoetig && !daten.aktiv ? `
    <div class="banner">
      <span>💾 Seit der letzten Sicherung hat sich etwas geändert.</span>
      <button class="primaer klein" data-aktion="export">Sicherung jetzt speichern</button>
    </div>` : '';
  $('#inhalt').innerHTML = banner + SEITEN[seite]();
}

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  seite = b.dataset.seite;
  zeichnen();
  window.scrollTo(0, 0);
});

$('#inhalt').addEventListener('click', e => {
  const b = e.target.closest('[data-aktion]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.aktion) {
    case 'neuer-abend': neuerAbend(); break;
    case 'auslosen': auslosen(); break;
    case 'strich': strichDazu(Number(d.team), d.typ); break;
    case 'strich-weg': strichWeg(Number(d.team)); break;
    case 'partie-abschliessen': partieAbschliessen(); break;
    case 'partie-loeschen': partieLoeschen(Number(d.index)); break;
    case 'abend-abschliessen': abendAbschliessen(); break;
    case 'abend-loeschen': {
      const a = daten.abende.find(x => x.id === d.id);
      if (a && confirm(`Jassabend vom ${datumLang(a.datum)} wirklich löschen? Auch sein Beitrag zur Jasskasse verschwindet.`)) {
        daten.abende = daten.abende.filter(x => x.id !== d.id);
        aenderung(); zeichnen();
      }
      break;
    }
    case 'kasse-dazu': {
      const betrag = Number($('#k-betrag').value);
      const text = $('#k-text').value.trim();
      const datum = $('#k-datum').value || heute();
      if (!(betrag > 0)) { alert('Bitte einen Betrag eingeben.'); return; }
      daten.kasse.push({ id: id(), datum, betrag: betrag * Number(d.richtung), text: text || (d.richtung === '1' ? 'Einzahlung' : 'Ausgabe') });
      aenderung(); zeichnen();
      break;
    }
    case 'kasse-loeschen':
      if (confirm('Diese Buchung löschen?')) {
        daten.kasse = daten.kasse.filter(k => k.id !== d.id);
        aenderung(); zeichnen();
      }
      break;
    case 'export': exportieren(); break;
    case 'trumpf':
      formular.trumpf = d.trumpf;
      if (d.trumpf === 'obenabe' || d.trumpf === 'undenufe') formular.stoeck = null;
      zeichnen(); break;
    case 'matsch': {
      const t = Number(d.team);
      formular.matsch = formular.matsch === t ? null : t;
      zeichnen(); break;
    }
    case 'stoeck': {
      const t = Number(d.team);
      formular.stoeck = formular.stoeck === t ? null : t;
      zeichnen(); break;
    }
    case 'weis': formular.weis[d.team] += Number(d.wert); zeichnen(); break;
    case 'weis-weg': formular.weis[d.team] = 0; zeichnen(); break;
    case 'spiel-eintragen': spielEintragen(); break;
    case 'formular-leeren':
      formular = leeresFormular();
      if (zurueckZurTafel) { ansicht = 'tafel'; zurueckZurTafel = false; }
      zeichnen(); break;
    case 'ansicht': ansicht = d.ansicht; zurueckZurTafel = false; zeichnen(); window.scrollTo(0, 0); break;
    case 'zur-eingabe':
      ansicht = 'eingabe'; zurueckZurTafel = true; zeichnen();
      $('#zaehler').scrollIntoView();
      break;
    case 'spiel-bearbeiten': {
      const s = daten.aktiv.laufend.spiele[Number(d.index)];
      formular = {
        trumpf: s.trumpf, stich: s.matsch !== null ? ['', ''] : s.stich.map(String), matsch: s.matsch,
        weis: [...s.weis], stoeck: s.stoeck, bearbeiten: Number(d.index),
      };
      zeichnen();
      $('#zaehler').scrollIntoView({ behavior: 'smooth' });
      break;
    }
    case 'spiel-loeschen':
      e.stopPropagation();
      if (confirm(`Spiel ${Number(d.index) + 1} löschen?`)) {
        daten.aktiv.laufend.spiele.splice(Number(d.index), 1);
        formular = leeresFormular();
        speichern(); zeichnen();
      }
      break;
    case 'start': daten.aktiv.laufend.start = Number(d.spieler); speichern(); zeichnen(); break;
    case 'start-zuruecksetzen': daten.aktiv.laufend.start = null; speichern(); zeichnen(); break;
    case 'richtung': daten.aktiv.laufend.richtung ^= 1; speichern(); zeichnen(); break;
    case 'ort-waehlen': daten.aktiv.ort = d.ort; speichern(); zeichnen(); break;
    case 'import': $('#import-datei').click(); break;
  }
});

$('#inhalt').addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'abend-datum' && el.value) { daten.aktiv.datum = el.value; speichern(); }
  else if (el.id === 'abend-ort') { daten.aktiv.ort = el.value.trim(); speichern(); }
  else if (el.dataset.ortAbend) {
    const a = daten.abende.find(x => x.id === el.dataset.ortAbend);
    if (a) { a.ort = el.value.trim(); aenderung(); }
  }
  else if (el.id === 'rangliste-jahr') { ranglistenJahr = el.value; zeichnen(); }
  else if (el.id === 'import-datei' && el.files[0]) importieren(el.files[0]);
  else if (el.dataset.spieler) { daten.spieler[el.dataset.spieler] = el.value.trim() || `Spieler ${Number(el.dataset.spieler) + 1}`; aenderung(); }
  else if (el.dataset.titel) { daten.titel[el.dataset.titel] = el.value.trim(); aenderung(); }
  else if (el.dataset.faktor) {
    const wert = Number(el.value);
    if (wert > 0) { daten.regeln.faktoren[el.dataset.faktor] = wert; aenderung(); }
  }
  else if (el.dataset.regel) {
    const wert = Number(el.value);
    if (wert >= 0) { daten.regeln[el.dataset.regel] = wert; aenderung(); }
  }
});

$('#inhalt').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.punkte !== undefined) { daten.aktiv.laufend.punkte[el.dataset.punkte] = el.value; speichern(); }
  else if (el.dataset.stich !== undefined) {
    const t = Number(el.dataset.stich);
    const wert = el.value === '' ? '' : Number(el.value);
    formular.stich[t] = el.value;
    formular.stich[1 - t] = wert !== '' && wert >= 0 && wert <= STICH_TOTAL ? String(STICH_TOTAL - wert) : '';
    $(`[data-stich="${1 - t}"]`).value = formular.stich[1 - t];
    $('#vorschau').innerHTML = vorschauText(daten.aktiv, formularSpiel().spiel);
  }
  else if (el.dataset.weis !== undefined) {
    formular.weis[el.dataset.weis] = Math.max(0, Number(el.value) || 0);
    $('#vorschau').innerHTML = vorschauText(daten.aktiv, formularSpiel().spiel);
  }
  else if (el.id === 'abend-ort') { daten.aktiv.ort = el.value; speichern(); }
});

$('#logo').innerHTML = farbe('rosen', 30);
zeichnen();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
